name: ubuntu-image-grub-orangepi-combined

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.model }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false # 片方が失敗しても、もう片方のビルドを続行する
      matrix:
        include:
          - model: orangepi-5
            defconfig: orangepi-5-rk3588s_defconfig
            dtb: rk3588s-orangepi-5
          - model: orangepi-5-plus
            defconfig: orangepi-5-plus-rk3588_defconfig
            dtb: rk3588-orangepi-5-plus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: u-boot
        run: /bin/bash ./das-u-boot.sh ${{ matrix.defconfig }}

      - name: rootfs
        run: |
          chmod +x ubuntu-image.sh
          sudo ./ubuntu-image.sh

      - name: disk image
        run: |
          chmod +x disk_image.sh
          # 引数を matrix から取得
          sudo ./disk_image.sh arm64 ${{ matrix.model }} ${{ matrix.dtb }}
          echo "============================"
          ls -l
          echo "============================="

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: |
          if [ -f kernel_version ]; then
            cat kernel_version >> $GITHUB_OUTPUT
          else
            echo "kernel_version=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Rename files to avoid conflict
        run: |
          # モデル名をつけてリネーム（例: u-boot-rockchip.bin -> u-boot-rockchip-orangepi-5.bin）
          mv u-boot-rockchip.bin u-boot-rockchip-${{ matrix.model }}.bin
          # 他に重複しそうなファイルがあれば同様にリネーム
          if [ -f sd-card.txt ]; then mv sd-card.txt sd-card-${{ matrix.model }}.txt; fi


      # リリース作成（5とPLUSの両方が完了するのを待たず、各自がアップロード）
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Orange Pi 5/PLUS Disk Image Build ${{ github.run_number }}"
          body: |
            Orange Pi 5 / 5 PLUS Grub boot Disk Image
            ビルド日時: ${{ steps.date.outputs.now }}
            ベースカーネル: ${{ steps.kernel.outputs.kernel_version }}
          draft: false
          prerelease: false
          files: |
            ./Ubuntu-*img.xz
            ./sd-card.txt
            ./u-boot-rockchip.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
