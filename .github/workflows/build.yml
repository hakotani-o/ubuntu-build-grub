name: ubuntu-image-grub-orangepi-combined

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.model }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: orangepi-5
            defconfig: orangepi-5-rk3588s_defconfig
            dtb: rk3588s-orangepi-5
          - model: orangepi-5-plus
            defconfig: orangepi-5-plus-rk3588_defconfig
            dtb: rk3588-orangepi-5-plus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: u-boot
        run: /bin/bash ./das-u-boot.sh ${{ matrix.defconfig }}

      - name: rootfs
        run: |
          chmod +x ubuntu-image.sh
          sudo ./ubuntu-image.sh

      - name: disk image
        run: |
          chmod +x disk_image.sh
          sudo ./disk_image.sh arm64 ${{ matrix.model }} ${{ matrix.dtb }}

      - name: Rename files to avoid conflict
        run: |
          # リリース時に混ざらないよう、成果物を1つのフォルダに集めます
          mkdir final_assets
          # .imgファイルを移動（もし拡張子が違う場合は適宜修正してください）
          mv *.img* final_assets/ || true
          # リネームしたu-bootなども移動
          mv u-boot-rockchip.bin final_assets/u-boot-rockchip-${{ matrix.model }}.bin || true
          if [ -f sd-card.txt ]; then mv sd-card.txt final_assets/sd-card-${{ matrix.model }}.txt; fi

      # ここで一時保存（これが終わるとこのジョブのデータは消えるので artifact に預ける）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.model }}
          path: final_assets/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 全てのbuildジョブ（2つ分）からファイルをダウンロードして release-assets フォルダに入れる
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Check downloaded files
        run: ls -R release-assets/

      # ここで1回だけリリースを作成
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }}
          files: release-assets/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
